  faster_rcnn_r18_online_distilled:
    backbone: "resnet18"
    epochs: 50
    batch: 8
    lr: 0.001
    weight_decay: 0.0005
    type: "online_distilled"
    patience: 20
    description: "Online дистилляция — учитель помогает в реальном времени"

detection:
  data_path: "/app/data/experiment_v3/datasets/real_baseline"
  num_classes: 4
  img_size: [640, 640]
  class_names:
    0: "defect1"
    1: "defect2"
    2: "defect3"
    3: "defect4"

paths:
  detection_output: "/app/online_distillation/detectors"
  results_dir: "/app/online_distillation/reports"

fps:
  device: "cpu"
  warmup: 50
  iterations: 200
  img_size: [640, 640]