experiment:
  name: "online_distillation"
  description: "Online Detection Distillation — учитель помогает ученику в реальном времени"
  hypothesis: "Online дистилляция превосходит двухэтапные методы при меньшем времени обучения"

teacher:
  model: "dinov3/vits16-ltdetr-coco"
  weights: "/app/data/experiment_v3/models/teacher/teacher_mixed_full_ssl/exported_models/exported_best.pt"

online_distillation:
  epochs: 50
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0005
  patience: 20
  
  # Веса компонент лосса
  detection_weight: 0.7
  feature_distill_weight: 0.2
  attention_distill_weight: 0.1
  
  # Feature distillation
  feature_temperature: 3.0
  normalize_features: true
  
  # Учитель помогает только первые N эпох
  teacher_epochs: 40  # потом только GT

students:
  # faster_rcnn_r18_scratch:
  #   backbone: "resnet18"
  #   epochs: 50
  #   batch: 8
  #   lr: 0.001
  #   weight_decay: 0.0005
  #   type: "scratch"
  #   patience: 20
    
  # faster_rcnn_r18_imagenet:
