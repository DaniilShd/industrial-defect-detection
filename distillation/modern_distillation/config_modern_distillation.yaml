experiment:
  name: "modern_distillation_2025"
  description: "Современный подход 2025-2026: Contrastive + Ranking + Multi-Scale Masking"
  hypothesis: "Современный подход к дистилляции превосходит все предыдущие методы"

teacher:
  model: "dinov3/vits16-ltdetr-coco"
  weights: "/app/data/experiment_v3/models/teacher/teacher_mixed_full_ssl/exported_models/exported_best.pt"

modern_distillation:
  unlabeled_data: "/app/data/experiment_v3/datasets/mixed_full/train/images"
  
  # Архитектура
  teacher_layers: [4, 8, 12, 16, 20, 24]
  student_layers: ['layer1', 'layer2', 'layer3', 'layer4']
  
  layer_mapping:
    4: 'layer1'
    8: 'layer1'
    12: 'layer2'
    16: 'layer3'
    24: 'layer4'
  
  # Гиперпараметры
  epochs: 50
  batch_size: 128
  image_size: [224, 224]
  learning_rate: 0.0003
  weight_decay: 0.00005
  warmup_epochs: 5
  
  # Современные компоненты
  components:
    # 1. Multi-Scale Feature Distillation
    feature_matching:
      enabled: true
      weight: 0.25
      use_smooth_l1: true
      normalize: true
      temperature: 3.0
    
    # 2. Ranking-Aware Contrastive
    contrastive:
      enabled: true
      weight: 0.20
      temperature: 0.07
      num_negatives: 4096
      memory_bank_size: 8192
    
    # 3. Structural Relation
    structural:
      enabled: true
      weight: 0.15
      distance_metric: "cosine"
      num_neighbors: 5
    
    # 4. Multi-Scale Masking
    masking:
      enabled: true
      weight: 0.15
      mask_ratios: [0.3, 0.5, 0.7]
      spatial_mask: true
      channel_mask: false
    
    # 5. Attention Transfer
    attention:
      enabled: true
      weight: 0.15
      use_mse: true
    
    # 6. Adaptive Balancing
    adaptive:
      enabled: true
      update_freq: 10
      momentum: 0.9
  
  # Адаптеры
  use_adapters: true
  adapter_hidden_dim: 1024
  adapter_dropout: 0.1
  
  # Аугментации
  augmentations:
    random_horizontal_flip: true
    color_jitter: {brightness: 0.2, contrast: 0.2}
    random_grayscale: 0.1
    gaussian_blur: {kernel_size: 3, sigma: [0.1, 2.0]}

