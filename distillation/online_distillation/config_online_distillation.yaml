experiment:
  name: "online_distillation_detr_to_frcnn"
  description: "Online Knowledge Distillation: DINOv3 LTDETR → Faster R-CNN ResNet-18"
  hypothesis: "Гибридная дистилляция улучшает Faster R-CNN при том же количестве данных"

teacher:
  model: "dinov3/vits16-ltdetr-coco"
  weights: "/app/data/experiment_v3/models/teacher/teacher_mixed_full_ssl/exported_models/exported_best.pt"

online_distillation:
  epochs: 50
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0005
  patience: 20
  
  # Веса компонент лосса
  detection_weight: 0.5
  feature_distill_weight: 0.3
  detection_distill_weight: 0.2
  
  # Feature distillation
  feature_distill:
    temperature: 3.0
    normalize_features: true
  
  # Detection distillation  
  detection_distill:
    temperature: 4.0
    iou_threshold: 0.5
    background_weight: 0.1
  
  # Учитель помогает только первые N эпох
  teacher_epochs: 40

students:
  faster_rcnn_r18_online_distilled:
    backbone: "resnet18"
    type: "online_distilled"
    description: "Faster R-CNN ResNet-18 с online дистилляцией от DINOv3 LTDETR"

detection:
  data_path: "/app/data/experiment_v3/datasets/mixed_full"
  num_classes: 4
  img_size: [640, 640]
  class_names:
    0: "defect1"
    1: "defect2"
    2: "defect3"
    3: "defect4"

paths:
  detection_output: "/app/online_distillation/detectors"
  results_dir: "/app/online_distillation/reports"