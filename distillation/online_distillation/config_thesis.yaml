# Конфигурация экспериментов для магистерской работы
seed: 42

# SSL Pretraining
ssl_pretraining:
  model: "torchvision/resnet18"
  method: "distillationv3"
  teacher: "dinov3/vits16"
  epochs: 100
  batch_size: 128

# Pseudo-label generation
pseudo_labels:
  confidence_threshold: 0.6
  sahi_overlap: 0.3

# Teacher model
teacher:
  model: "dinov3/vits16-ltdetr-coco"
  weights: "/app/data/experiment_v3/models/teacher/teacher_mixed_full_ssl/exported_models/exported_best.pt"

# Training settings
training:
  epochs: 50
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0005
  patience: 20

# Data
data:
  path: "/app/data/experiment_v3/datasets/mixed_full"
  num_classes: 4
  img_size: [640, 640]
  class_names:
    0: "defect1"
    1: "defect2"
    2: "defect3"
    3: "defect4"

# Output paths
paths:
  ssl_output: "/app/online_distillation/thesis_experiments/ssl_pretraining"
  pseudo_labels_output: "/app/online_distillation/thesis_experiments/pseudo_labels"
  experiments_output: "/app/online_distillation/thesis_experiments/results"