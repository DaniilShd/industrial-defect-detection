experiment:
  name: "synthetic_data_efficacy"
  description: "Влияние синтетических данных на качество LT-DETR детекции дефектов"
  author: "магистерская диссертация"

paths:
  experiment_data: "/app/data/experiment_v2/datasets"
  results_dir: "/app/data/experiment_v2/reports"
  models_dir: "/app/data/experiment_v2/models"

datasets:
  real_baseline:
    data_yaml: "real_baseline/data.yaml"
    type: "baseline"
  real_augmented:
    data_yaml: "real_augmented/data.yaml"
    type: "augmented"
  synthetic_full:
    data_yaml: "synthetic_full/data.yaml"
    type: "synthetic_only"
  real_plus_synthetic_aug:
    data_yaml: "real_plus_synthetic_aug/data.yaml"
    type: "mixed"
  mixed_full:
    data_yaml: "mixed_full/data.yaml"
    type: "mixed"

training:
  model: "dinov3/vits16-ltdetr-coco"
  gradient_accumulation_steps: 1
  max_steps:
    real_baseline: 1600              # 10 эпох
    real_augmented: 4770             # 10 эпох
    synthetic_full: 6350            # 10 эпох
    real_plus_synthetic_aug: 4770    # 10 эпох
    mixed_full: 11120                # 10 эпох
  val_every_steps: 500
  lr: 0.0001
  batch_size: 8
  eval_conf_threshold: 0.001
  conf_threshold: 0.25

# SSL настройки (используются в exp3_ssl)
ssl:
  epochs: 400
  batch_size: 64

seeds: [42]  # [42, 123, 777] для стат. значимости

statistics:
  alpha: 0.05
  correction_method: "holm"

classes:
  num_classes: 4
  names:
    0: "defect1"
    1: "defect2"
    2: "defect3"
    3: "defect4"

mlflow:
  tracking_uri: "file:///app/mlruns"
  experiment_name: "synthetic_efficacy_experiment"