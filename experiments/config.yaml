experiment:
  name: "synthetic_data_efficacy"
  description: "Влияние синтетических данных на качество LT-DETR детекции дефектов"
  author: "магистерская диссертация"

paths:
  experiment_data: "/app/data/experiment/datasets"
  results_dir: "/app/experiments/reports"
  models_dir: "/app/experiments/models"

datasets:
  real_baseline:
    data_yaml: "real_baseline/data.yaml"
    type: "baseline"
  real_augmented:
    data_yaml: "real_augmented/data.yaml"
    type: "augmented"
  synthetic_full:
    data_yaml: "synthetic_full/data.yaml"
    type: "synthetic_only"
  real_plus_synthetic_aug:
    data_yaml: "real_plus_synthetic_aug/data.yaml"
    type: "mixed"
  mixed_full:
    data_yaml: "mixed_full/data.yaml"
    type: "mixed"

training:
  model: "dinov3/convnext-large-ltdetr-coco"
  gradient_accumulation_steps: 2
  max_steps:
    real_baseline: 3200              # 20 × 160.1
    real_augmented: 12720            # 20 × 636
    synthetic_full: 19035            # 20 × 951.75
    real_plus_synthetic_aug: 12720   # 20 × 636
    mixed_full: 31755                # 20 × 1587.75
  val_every_steps: 500
  lr: 0.0001
  batch_size: 4
  eval_conf_threshold: 0.001
  conf_threshold: 0.25

ssl:
  unlabeled_data: "/app/data/unlabeled"
  epochs: 10
  batch_size: 32

seeds:  [42] #[42, 123, 777]

statistics:
  alpha: 0.05
  correction_method: "holm"

classes:
  num_classes: 4
  names:
    0: "defect1"
    1: "defect2"
    2: "defect3"
    3: "defect4"

mlflow:
  tracking_uri: "file:///app/mlruns"
  experiment_name: "synthetic_efficacy_experiment"