# ============================================================
# ABLATION STUDY — ТЕСТОВЫЙ КОНФИГ (1 комбинация, 100 шагов)
# ============================================================

experiment:
  name: "ablation_test"
  description: "TEST - проверка пайплайна"

# Фиксированные параметры обучения LT-DETR
ltdetr:
  max_steps: 100          # Тест: всего 100 шагов (~2 минуты)
  val_every_steps: 50     # Валидация каждые 50 шагов
  lr: 0.0001
  batch_size: 8
  freeze_backbone: true
  seed: 42

# Пути к данным
paths:
  real_train: "/app/data/processed/balanced_defect_patches_v2/train"
  real_val: "/app/data/processed/balanced_defect_patches_v2/val"
  real_test: "/app/data/processed/balanced_defect_patches_v2/test"
  results_dir: "/app/data/results_v2/ablation_test"

# ============================================================
# СЕТКА ПАРАМЕТРОВ ГЕНЕРАЦИИ (1 комбинация для теста)
# ============================================================
grid:
  sd_defect_strength:
    - 0.15

  sd_background_strength:
    - 0.05

  high_freq_alpha:
    - 0.2

  variants:
    - 1

  balance_strategy:
    - "proportional"

  repeats: 1

# ============================================================
# ФИКСИРОВАННЫЕ ПАРАМЕТРЫ ГЕНЕРАЦИИ
# ============================================================
fixed_generation:
  random_seed: 42
  sd_steps: 5              # Тест: меньше шагов для скорости
  sd_guidance_scale: 1.8
  bg_sd_steps: 5           # Тест: меньше шагов
  bg_guidance_scale: 1.5
  
  defect_prompt: "metal surface defect, scratch, industrial steel texture, metallic sheen, brushed metal"
  defect_negative: "smooth, plastic, wood, rust, glass, organic, painted, colorful, rainbow, vibrant"
  background_prompt: "industrial steel surface, brushed metal texture, metallic sheen, uniform metal"
  background_negative: "defect, scratch, crack, dent, damage, rust, colorful, rainbow, vibrant"
  
  defect_color_correction: 0.85
  background_color_correction: 0.6
  defect_consistency: 0.8
  
  use_spectrum_matching: true
  use_high_freq_injection: true
  
  scale_factors:
    - [1.05, 1.0]
    - [1.0, 1.05]

# MLflow
mlflow:
  tracking_uri: "file:///app/mlruns"
  experiment_name: "ablation_test"
